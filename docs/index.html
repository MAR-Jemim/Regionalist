<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CP Roadmap</title>
<meta name="description" content="A competitive programming roadmap from setup to ICPC, with live Codeforces progress sync.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9819;</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brand">CP Roadmap <span>&middot; basics to ICPC</span></div>
    <div class="spacer"></div>
    <div class="seg" id="lang">
      <button data-lang="cpp" aria-pressed="true">C++</button>
      <button data-lang="py" aria-pressed="false">Python</button>
    </div>
    <div class="hfield">
      <input id="handle" placeholder="codeforces handle" spellcheck="false"
             autocomplete="off" autocapitalize="off">
      <button class="btn primary" id="sync">Sync</button>
    </div>
  </div>
</header>

<main>
  <div class="status" id="status">Loading roadmap…</div>
  <div class="dash" id="dash"></div>

  <div class="filters" id="filters">
    <label>Filter</label>
    <button class="chip" data-f="todo" aria-pressed="false">Unfinished only</button>
    <button class="chip" data-f="icpc" aria-pressed="false">ICPC core</button>
    <label style="margin-left:9px">Tier</label>
    <button class="chip" data-f="0" data-tier aria-pressed="false">0</button>
    <button class="chip" data-f="1" data-tier aria-pressed="false">1</button>
    <button class="chip" data-f="2" data-tier aria-pressed="false">2</button>
    <button class="chip" data-f="3" data-tier aria-pressed="false">3</button>
    <button class="chip" data-f="4" data-tier aria-pressed="false">4</button>
    <button class="chip" data-f="5" data-tier aria-pressed="false">5</button>
    <button class="chip" data-f="6" data-tier aria-pressed="false">6</button>
  </div>

  <div id="tiers"></div>
</main>

<footer>
  Progress is stored in this browser only. Solved problems come from the public Codeforces API;
  CSES and AtCoder items are ticked by hand. Edit <code>docs/data/topics/*.json</code> to change content.
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Topic detail">
  <div class="dhead">
    <div class="row">
      <h2 id="dtitle"></h2>
      <button class="close" id="dclose" aria-label="Close">&times;</button>
    </div>
    <div class="kv" id="dkv"></div>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<script src="js/app.js"></script>
</body>
</html>
